<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1600px; height: 900px; overflow: hidden;
    background: #08090f;
    color: #f2f3fa;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .glow { position: absolute; border-radius: 50%; filter: blur(10px); }
  .g1 { width: 900px; height: 900px; left: -260px; top: -420px; background: radial-gradient(circle, rgba(111,111,245,.55), transparent 62%); }
  .g2 { width: 760px; height: 760px; right: -220px; top: -260px; background: radial-gradient(circle, rgba(255,122,184,.30), transparent 62%); }
  .g3 { width: 900px; height: 600px; left: 30%; bottom: -420px; background: radial-gradient(circle, rgba(139,139,255,.22), transparent 65%); }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: linear-gradient(180deg, rgba(0,0,0,.9), transparent 80%);
  }
  .frame { position: absolute; inset: 48px; border: 1px solid rgba(255,255,255,.10); border-radius: 28px; }
  .content { position: relative; height: 100%; padding: 104px 110px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 14px; color: #9aa0b6; font-size: 15px; letter-spacing: .34em; text-transform: uppercase; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg,#6f6ff5,#ff7ab8); box-shadow: 0 0 22px rgba(167,139,250,.8); }
  h1 { margin: 54px 0 0; font-size: 168px; line-height: .94; letter-spacing: -.06em; font-weight: 800;
    background: linear-gradient(120deg,#ffffff 18%, #b9b6ff 58%, #ff9ec7 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 28px; color: #a9afc4; font-size: 26px; letter-spacing: .02em; }
  .rule { width: 520px; height: 1px; margin-top: 46px; background: linear-gradient(90deg, rgba(255,255,255,.35), transparent); }
  .meta { margin-top: 30px; display: flex; gap: 34px; color: #767d94; font-family: "Cascadia Code", Consolas, monospace; font-size: 15px; letter-spacing: .16em; }
  .meta b { color: #b9b6ff; font-weight: 500; }
  .orb { position: absolute; border-radius: 50%; }
  .orb1 { width: 460px; height: 460px; right: 96px; bottom: 88px; border: 1px solid rgba(255,255,255,.14); }
  .orb2 { width: 300px; height: 300px; right: 176px; bottom: 168px; border: 1px solid rgba(255,255,255,.10); }
  .orb3 { width: 170px; height: 170px; right: 241px; bottom: 233px; background: linear-gradient(135deg, rgba(111,111,245,.85), rgba(255,122,184,.8)); filter: blur(2px); box-shadow: 0 0 120px rgba(139,139,255,.55); }
  .code { position: absolute; right: 120px; bottom: 96px; color: #596078; font-family: "Cascadia Code", Consolas, monospace; font-size: 14px; line-height: 1.9; text-align: right; }
  .code b { color: #8b8bff; font-weight: 500; }
  .tag { position: absolute; right: 110px; top: 110px; padding: 10px 18px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; color: #c9cde0; font-size: 14px; letter-spacing: .12em; }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
    <div class="grid"></div>
    <div class="frame"></div>
    <div class="content">
      <div class="top"><span class="dot"></span>Personal Blog · Since 2026</div>
      <h1>LeleBlog</h1>
      <div class="sub">写代码，也写生活。</div>
      <div class="rule"></div>
      <div class="meta"><span><b>MARKDOWN</b></span><span><b>KATEX</b></span><span><b>STATIC SITE</b></span></div>
    </div>
    <div class="tag">README / 2026</div>
    <div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>
    <div class="code"><div>$ npm run build</div><div>bundle <b>24 posts</b> → dist/</div><div>deploy <b>github pages</b></div></div>
  </div>
</body>
</html>
